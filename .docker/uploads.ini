; Upload limits for the image forms. upload_max_filesize is also the maximum image size enforced by
; ImageType (form validation and the drop zone), so change it here only.
upload_max_filesize = 5M
; images dropped on the item form are uploaded one by one (one request per file), so these limits only
; matter for files chosen with the regular file inputs
post_max_size = 128M
max_file_uploads = 50
; saving an item resizes every new image, a large batch needs more than the default 30 seconds
max_execution_time = 300
